<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いつもの</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

    <div class="chat-container">

        <header>
            <h1>いつもの</h1>
        </header>

        <main>

            <div class="message-row left">
                <div class="bubble other">
                    今日通話できる人いる？
                </div>
            </div>

            <div class="message-row right">
                <div class="bubble me">
                    はーい！夜なら大丈夫だよ！
                </div>
            </div>

            <div class="message-row left">
                <div class="bubble other">
                    何時くらいから空いてる？
                </div>
            </div>

            <div class="message-row right">
                <div class="bubble me">
                    20時以降なら参加できる！
                </div>
            </div>

            <div class="message-row left">
                <div class="bubble other">
                    了解！他に来れそうな人いるかな？
                </div>
            </div>

            <div class="message-row right">
                <div class="bubble me">
                    多分あと数人来ると思うよ。みんな学校やアルバイトが終わってから集まる予定だから、21時くらいになればかなり人数が増えてにぎやかになるんじゃないかな。
                </div>
            </div>

        </main>

        <footer>
            <input type="text" placeholder="メッセージを入力">
            <button>送信</button>
        </footer>

    </div>

</body>
</html>
